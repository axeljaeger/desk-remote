name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Tab5 firmware
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --no-modify-path --profile minimal --default-toolchain 1.100.0 --target riscv32imafc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python -m pip install idf-component-manager==2.5.0
          idf.py -C firmware -B "$PWD/firmware/build" -D "SDKCONFIG=$PWD/firmware/build/sdkconfig" \
            merge-bin -o desk-remote-tab5.bin
          git diff -- firmware/dependencies.lock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desk-remote-tab5
          path: |
            firmware/build/desk-remote-tab5.bin
            firmware/build/tab5_slint_smoke.bin
            firmware/dependencies.lock
          if-no-files-found: error

  companion:
    name: macOS companion
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and package the companion
        run: |
          app_bundle="$(sh companion/build.sh)"
          ditto -c -k --keepParent "$app_bundle" desk-remote-macos-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: desk-remote-macos-arm64.zip
          archive: false
          if-no-files-found: error
